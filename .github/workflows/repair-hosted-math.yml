name: Apply the inspected hosted-math compatibility repair

on:
  pull_request:
    paths:
      - '.github/workflows/repair-hosted-math.yml'

permissions:
  contents: read

jobs:
  repair:
    if: github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == 'GoGoKo699/Universal-Magic-Noise-Cost' && github.event.pull_request.head.ref == 'merlin/research-integration-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Apply only the observed formatting substitutions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          changed = []
          for path in Path('.').rglob('*.md'):
              if '.git' in path.parts:
                  continue
              old = path.read_text(encoding='utf-8')
              names = set(re.findall(r'\\operatorname\{([A-Za-z]+)\}', old))
              if not names <= {'Tr', 'Bin', 'span', 'Sym'}:
                  raise ValueError(f'Unreviewed operator in {path}: {names}')
              new = re.sub(r'\\operatorname\{(Tr|Bin|span|Sym)\}', lambda m: '\\mathrm{' + m[1] + '}', old)
              new = re.sub(r'\\tag\{([A-Z][0-9]+)\}', lambda m: '\\qquad\\text{(' + m[1] + ')}', new)
              if new != old:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          assert changed, 'No repair applied'
          path = Path('verification/check_hosted.py')
          text = path.read_text()
          text = text.replace('.katex-error, [data-mjx-error]', '.katex-error, [data-mjx-error], .flash-error')
          text = text.replace("const failed = collect(root, '[data-mjx-error], mjx-merror, merror, .katex-error');", "const failed = collect(root, '[data-mjx-error], mjx-merror, merror, .katex-error, .flash-error');")
          text = text.replace("PAGES = ('README.md', 'learning/GOTTESMAN_BRIDGE.md', 'science/converse.md')", "PAGES = ('README.md', 'learning/GOTTESMAN_BRIDGE.md', 'science/model.md', 'science/results.md', 'science/converse.md', 'science/construction.md', 'science/finite_protocols.md')")
          text = text.replace('print(json.dumps(report), flush=True)', "print(json.dumps({k: v for k, v in report.items() if k != 'math'} | {'unrendered': [m for m in report.get('math', []) if not m['rendered'] or m['errors']], 'display_heights': [m['height'] for m in report.get('math', []) if m['width'] >= 0.9 * report['article_width']]}), flush=True)")
          path.write_text(text)
          Path('.github/workflows/repair-hosted-math.yml').unlink()
          print('Formatting-only Markdown repairs:', ', '.join(changed))
          PY
          python -m py_compile verification/check_hosted.py
          python verification/check_docs.py
      - name: Save the repair to the same review branch
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/merlin/research-integration-20261029 | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --stat
          git commit -m 'Repair observed GitHub math macro failures and numbered-display layout'
          git push origin HEAD:refs/heads/merlin/research-integration-20261029
