name: Verify scientific and learning records

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the pinned dependency
        run: python -m pip install -r verification/requirements.txt
      - name: Exact scientific checks
        run: python verification/run_all.py
      - name: Learning map and Markdown source checks
        run: python verification/check_docs.py
